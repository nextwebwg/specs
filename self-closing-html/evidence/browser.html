<!doctype html><meta charset="utf-8"><title>Self-closing boundary probe</title><h1>Inert parsing boundary probe</h1><p>Hand-expanded examples compare existing parser behavior; this is not an implementation of Next parsing.</p><p id="status"></p><pre id="results"></pre><script>
const cases = [{"name": "style text boundary", "legacy": "\u003cstyle/>\u003cimg data-probe>\u003cstyle>\u003c/style>", "expanded": "\u003cstyle>\u003c/style>\u003cimg data-probe>\u003cstyle>\u003c/style>"}, {"name": "textarea text boundary", "legacy": "\u003ctextarea/>\u003cimg data-probe>\u003ctextarea>\u003c/textarea>", "expanded": "\u003ctextarea>\u003c/textarea>\u003cimg data-probe>\u003ctextarea>\u003c/textarea>"}, {"name": "custom element before MathML integration boundary", "legacy": "\u003cmath>\u003cmtext>\u003cx-box/>\u003cmglyph>\u003cstyle>\u003cimg data-probe>\u003c/style>\u003c/mglyph>\u003c/mtext>\u003c/math>", "expanded": "\u003cmath>\u003cmtext>\u003cx-box>\u003c/x-box>\u003cmglyph>\u003cstyle>\u003cimg data-probe>\u003c/style>\u003c/mglyph>\u003c/mtext>\u003c/math>"}, {"name": "closing HTML ancestor across SVG boundary", "legacy": "\u003cx-box/>\u003csvg>\u003c/x-box>\u003cstyle>\u003cimg data-probe>\u003c/style>\u003c/svg>", "expanded": "\u003cx-box>\u003c/x-box>\u003csvg>\u003c/x-box>\u003cstyle>\u003cimg data-probe>\u003c/style>\u003c/svg>"}, {"name": "closing div across SVG boundary", "legacy": "\u003cdiv/>\u003csvg>\u003c/div>\u003cstyle>\u003cimg data-probe>\u003c/style>\u003c/svg>", "expanded": "\u003cdiv>\u003c/div>\u003csvg>\u003c/div>\u003cstyle>\u003cimg data-probe>\u003c/style>\u003c/svg>"}];
function inspect(source) {
 const doc = new DOMParser().parseFromString('<!doctype html><body>' + source, 'text/html');
 return {visibleMarkerElements: doc.querySelectorAll('img[data-probe]').length, styles: [...doc.querySelectorAll('style')].map(e => ({namespace:e.namespaceURI,text:e.textContent})), serialized: doc.documentElement.outerHTML};
}
const results = cases.map(c=>({name:c.name,source:c.legacy,legacy:inspect(c.legacy),handExpanded:inspect(c.expanded)}));
const passed = results.every(r => r.legacy.visibleMarkerElements === 0 && r.handExpanded.visibleMarkerElements === 1);
document.querySelector('#status').textContent = passed ? 'PASS: all five source pairs show the expected boundary change.' : 'FAIL: this browser differs from the recorded expectations.';
document.querySelector('#results').textContent=JSON.stringify(results,null,2);
</script>
